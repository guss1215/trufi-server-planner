name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Install dependencies
      run: dart pub get

    - name: Build Docker image
      run: docker build -t trufi-server-planner:test .

    - name: Stage GTFS for tests
      run: |
        # data/ is gitignored — populate it from the committed example feed
        # so the container can read /app/data/gtfs.zip at runtime.
        mkdir -p data
        cp example.gtfs.zip data/gtfs.zip

    - name: Start server
      run: |
        # docker-compose mounts ./data in production; CI mirrors that since
        # the Dockerfile intentionally does not bake the GTFS into the image
        # (so the same image works for any city via volume mount).
        docker run -d -p 9090:8080 --name trufi-test \
          -v "${{ github.workspace }}/data:/app/data:ro" \
          trufi-server-planner:test
        sleep 20

    - name: Run integration tests
      run: dart test test/integration_test.dart

    - name: Show server logs on failure
      if: failure()
      run: docker logs trufi-test

    - name: Stop server
      if: always()
      run: docker stop trufi-test && docker rm trufi-test
